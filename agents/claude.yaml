# Claude Code consumes this skill directly from the SKILL.md frontmatter
# (the `name` and `description` fields), so no extra manifest is required to
# install it. This file documents the same interface metadata for parity with
# agents/openai.yaml and for tooling that wants a single place to read it.
interface:
  display_name: "M5Stack Arduino CLI"
  short_description: "Set up, flash, diagnose, and support M5Stack development from Arduino CLI on Windows or macOS."
  # In Claude Code, invoke the skill by name rather than with a $-prefixed token.
  default_prompt: "Use the m5stack-arduino-cli skill to set up, flash, and troubleshoot an M5Stack board with Arduino CLI on Windows or macOS."
